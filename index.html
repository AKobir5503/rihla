<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rihla</title>
  <meta name="description" content="Rihla: the GT MSA trivia journey. Rarer answers take you farther." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="play">
  <header class="topbar">
    <a class="brand" href="./"><canvas id="mascot" class="mascot" aria-hidden="true"></canvas>Rihla <span class="brand-sub">by GT MSA</span></a>
    <nav>
      <button class="link" id="nav-board">Leaderboard</button>
      <a class="link hidden" id="nav-admin" href="admin.html">Dashboard</a>
      <button class="link" id="nav-account">Sign in</button>
    </nav>
  </header>

  <div id="demo-banner" class="banner hidden">Demo mode: sample questions, no AI judging.</div>

  <section class="scene-wrap" aria-label="Your journey">
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="hud"><span class="hud-km" id="hud-km">0 km</span><span class="hud-zone" id="hud-zone"></span></div>
    <div class="arrive" id="arrive" role="status" aria-live="polite"></div>
    <div class="hud-next" id="hud-next"></div>
  </section>

  <main id="app" class="card"></main>

  <dialog id="auth-dialog">
    <form id="auth-form" method="dialog">
      <h2 id="auth-title">Sign in to play</h2>
      <p class="muted" id="auth-hint">Any email works. Your name shows on the leaderboard.</p>
      <label>Email <input name="email" type="email" required autocomplete="email" /></label>
      <label>Password <input name="password" type="password" required minlength="6" autocomplete="current-password" /></label>
      <label id="name-row" class="hidden">Display name <input name="name" maxlength="30" autocomplete="nickname" /></label>
      <p class="error" id="auth-error"></p>
      <div class="row">
        <button type="submit" class="primary" id="auth-submit">Sign in</button>
        <button type="button" class="link" id="auth-toggle">New here? Create an account</button>
      </div>
      <button type="button" class="close" id="auth-close" aria-label="Close">×</button>
    </form>
  </dialog>

  <script type="module" src="js/game.js"></script>
</body>
</html>
